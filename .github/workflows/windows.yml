name: Windows
permissions:
  contents: write
on:
  create:
    tags:
      - v*-windows
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: |
          td/vcpkg
          ~/.cache/vcpkg
        key: vcpkg-windows-${{ hashFiles('build-windows.sh') }}
        restore-keys: vcpkg-windows-

    - name: Cache TDLib build
      uses: actions/cache@v4
      with:
        path: |
          td/build
          td/example/java/build
        key: tdlib-windows-${{ github.sha }}
        restore-keys: tdlib-windows-

    - name: Build tdlib for windows
      shell: bash
      run: /bin/bash build-windows.sh

    - name: Package tdlib artifacts
      shell: bash
      env:
        OS_NAME: ${{ runner.os }}
      run: |
        set -e
        ARCH=$(uname -m)
        echo "ARCH=$ARCH" >> $GITHUB_ENV
        if [ -d tdlib ]; then
          ARTIFACT_DIR=tdlib
        elif [ -d td/tdlib ]; then
          ARTIFACT_DIR=td/tdlib
        else
          echo "Artifact directory not found" && ls -la && exit 1
        fi
        TAR_NAME="tdlib-${OS_NAME}-${ARCH}.tar.gz"
        tar -czf "$TAR_NAME" -C "$(dirname "$ARTIFACT_DIR")" "$(basename "$ARTIFACT_DIR")"
        echo "PACKAGE_FILE=$TAR_NAME" >> $GITHUB_ENV
        sha256sum "$TAR_NAME"

    - name: Publish release asset
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.ref }}
        files: ${{ env.PACKAGE_FILE }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
