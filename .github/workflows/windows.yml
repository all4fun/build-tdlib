name: Windows
permissions:
  contents: write
on:
  create:
    tags:
      - v*
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  windows:
    runs-on: windows-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup Java
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'

    - name: Cache vcpkg
      uses: actions/cache@v4
      with:
        path: ~/.cache/vcpkg
        key: vcpkg-windows-${{ hashFiles('build-windows.sh') }}
        restore-keys: vcpkg-windows-

    - name: Build tdlib for windows
      shell: bash
      run: /bin/bash build-windows.sh

    - name: Package tdlib artifacts
      shell: bash
      run: |
        set -e
        ARCH=$(uname -m)
        # Normalize arch names
        if [ "$ARCH" = "x86_64" ]; then
          ARCH="amd64"
        elif [ "$ARCH" = "aarch64" ]; then
          ARCH="arm64"
        fi
        echo "ARCH=$ARCH" >> $GITHUB_ENV
        # Add version to artifact name if triggered by tag
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          VERSION="${GITHUB_REF#refs/tags/}"
          TAR_NAME="tdlib-${VERSION}-windows-${ARCH}.tar.gz"
        else
          TAR_NAME="tdlib-windows-${ARCH}.tar.gz"
        fi
        # Prepare package directory with README
        mkdir -p package

        cp -r td/tdlib package/
        cp -r td/example/java/org package/
        cp README.md package/
        tar -czf "$TAR_NAME" -C package .
        echo "PACKAGE_FILE=$TAR_NAME" >> $GITHUB_ENV
        sha256sum "$TAR_NAME"

    - name: Publish release asset
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.ref }}
        files: ${{ env.PACKAGE_FILE }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
