name: Linux
permissions:
  contents: write
on:
  schedule:
    - cron: "0 0 1 * *"
  create:
    tags:
      - v*
  workflow_dispatch:

jobs:
  # Linux x86_64
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache TDLib build
      uses: actions/cache@v4
      with:
        path: |
          td/build
          td/example/java/build
        key: tdlib-linux-x86_64-${{ github.sha }}
        restore-keys: tdlib-linux-x86_64-

    - name: Build tdlib for Linux x86_64
      run: /bin/bash build-linux.sh

    - name: Package tdlib artifacts
      env:
        OS_NAME: ${{ runner.os }}
      run: |
        set -e
        ARCH=$(uname -m)
        echo "ARCH=$ARCH" >> $GITHUB_ENV
        if [ -d tdlib ]; then
          ARTIFACT_DIR=tdlib
        elif [ -d td/tdlib ]; then
          ARTIFACT_DIR=td/tdlib
        else
          echo "Artifact directory not found" && ls -la && exit 1
        fi
        TAR_NAME="tdlib-${OS_NAME}-${ARCH}.tar.gz"
        if [ "$ARTIFACT_DIR" = "td/tdlib" ]; then
          tar -czf "$TAR_NAME" -C td tdlib example/java
        else
          tar -czf "$TAR_NAME" -C . tdlib td/example/java
        fi
        echo "PACKAGE_FILE=$TAR_NAME" >> $GITHUB_ENV
        sha256sum "$TAR_NAME"

    - name: Publish release asset
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.ref }}
        files: ${{ env.PACKAGE_FILE }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Linux ARM64
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache TDLib build
      uses: actions/cache@v4
      with:
        path: |
          td/build
          td/example/java/build
        key: tdlib-linux-arm64-${{ github.sha }}
        restore-keys: tdlib-linux-arm64-

    - name: Build tdlib for Linux ARM64
      run: /bin/bash build-linux.sh

    - name: Package tdlib artifacts
      env:
        OS_NAME: ${{ runner.os }}
      run: |
        set -e
        ARCH=$(uname -m)
        echo "ARCH=$ARCH" >> $GITHUB_ENV
        if [ -d tdlib ]; then
          ARTIFACT_DIR=tdlib
        elif [ -d td/tdlib ]; then
          ARTIFACT_DIR=td/tdlib
        else
          echo "Artifact directory not found" && ls -la && exit 1
        fi
        TAR_NAME="tdlib-${OS_NAME}-${ARCH}.tar.gz"
        if [ "$ARTIFACT_DIR" = "td/tdlib" ]; then
          tar -czf "$TAR_NAME" -C td tdlib example/java
        else
          tar -czf "$TAR_NAME" -C . tdlib td/example/java
        fi
        echo "PACKAGE_FILE=$TAR_NAME" >> $GITHUB_ENV
        sha256sum "$TAR_NAME"

    - name: Publish release asset
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.ref }}
        files: ${{ env.PACKAGE_FILE }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
