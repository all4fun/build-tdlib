name: Linux
permissions:
  contents: write
on:
  create:
    tags:
      - v*
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Linux x86_64
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache TDLib build
      uses: actions/cache@v4
      with:
        path: |
          td/build
          td/example/java/build
        key: tdlib-linux-x86_64-${{ github.sha }}
        restore-keys: tdlib-linux-x86_64-

    - name: Build tdlib for Linux x86_64
      run: /bin/bash build-linux.sh

    - name: Package tdlib artifacts
      run: |
        set -e
        ARCH=$(uname -m)
        # Normalize arch names
        if [ "$ARCH" = "x86_64" ]; then
          ARCH="amd64"
        elif [ "$ARCH" = "aarch64" ]; then
          ARCH="arm64"
        fi
        echo "ARCH=$ARCH" >> $GITHUB_ENV
        # Add version to artifact name if triggered by tag
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          VERSION="${GITHUB_REF#refs/tags/}"
          TAR_NAME="tdlib-${VERSION}-linux-${ARCH}.tar.gz"
        else
          TAR_NAME="tdlib-linux-${ARCH}.tar.gz"
        fi
        # Prepare package directory with README
        mkdir -p package

        cp -r td/tdlib package/
        cp -r td/example/java/org package/

        cp README.md package/
        tar -czf "$TAR_NAME" -C package .
        echo "PACKAGE_FILE=$TAR_NAME" >> $GITHUB_ENV
        sha256sum "$TAR_NAME"

    - name: Publish release asset
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.ref }}
        files: ${{ env.PACKAGE_FILE }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Linux ARM64
  linux-arm64:
    runs-on: ubuntu-24.04-arm
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache TDLib build
      uses: actions/cache@v4
      with:
        path: |
          td/build
          td/example/java/build
        key: tdlib-linux-arm64-${{ github.sha }}
        restore-keys: tdlib-linux-arm64-

    - name: Build tdlib for Linux ARM64
      run: /bin/bash build-linux.sh

    - name: Package tdlib artifacts
      run: |
        set -e
        ARCH=$(uname -m)
        # Normalize arch names
        if [ "$ARCH" = "x86_64" ]; then
          ARCH="amd64"
        elif [ "$ARCH" = "aarch64" ]; then
          ARCH="arm64"
        fi
        echo "ARCH=$ARCH" >> $GITHUB_ENV
        # Add version to artifact name if triggered by tag
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          VERSION="${GITHUB_REF#refs/tags/}"
          TAR_NAME="tdlib-${VERSION}-linux-${ARCH}.tar.gz"
        else
          TAR_NAME="tdlib-linux-${ARCH}.tar.gz"
        fi
        # Prepare package directory with README
        mkdir -p package

        cp -r td/tdlib package/
        cp -r td/example/java/org package/

        cp README.md package/
        tar -czf "$TAR_NAME" -C package .
        echo "PACKAGE_FILE=$TAR_NAME" >> $GITHUB_ENV
        sha256sum "$TAR_NAME"

    - name: Publish release asset
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.ref }}
        files: ${{ env.PACKAGE_FILE }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
