name: MacOS
permissions:
  contents: write
on:
  schedule:
    - cron: "0 0 1 * *"
  create:
    tags:
      - v*
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # macOS ARM64 (M1/M2)
  macos-arm64:
    runs-on: macos-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache Homebrew packages
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/Homebrew
          /opt/homebrew/Cellar
        key: brew-arm64-${{ hashFiles('build-macos.sh') }}
        restore-keys: brew-arm64-

    - name: Cache TDLib build
      uses: actions/cache@v4
      with:
        path: |
          td/build
          td/example/java/build
        key: tdlib-macos-arm64-${{ github.sha }}
        restore-keys: tdlib-macos-arm64-

    - name: Build tdlib for macOS ARM64
      run: /bin/bash build-macos.sh

    - name: Package tdlib artifacts
      run: |
        set -e
        ARCH=$(uname -m)
        # Normalize arch names
        if [ "$ARCH" = "x86_64" ]; then
          ARCH="amd64"
        elif [ "$ARCH" = "aarch64" ]; then
          ARCH="arm64"
        fi
        echo "ARCH=$ARCH" >> $GITHUB_ENV
        # Add version to artifact name if triggered by tag
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          VERSION="${GITHUB_REF#refs/tags/}"
          TAR_NAME="tdlib-${VERSION}-macos-${ARCH}.tar.gz"
        else
          TAR_NAME="tdlib-macos-${ARCH}.tar.gz"
        fi
        # Prepare package directory with README
        mkdir -p package

        cp -r td/tdlib package/
        cp -r td/example/java/org package/

        cp README.md package/
        tar -czf "$TAR_NAME" -C package .
        echo "PACKAGE_FILE=$TAR_NAME" >> $GITHUB_ENV
        shasum -a 256 "$TAR_NAME"

    - name: Publish release asset
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.ref }}
        files: ${{ env.PACKAGE_FILE }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
