name: MacOS
permissions:
  contents: write
on:
  schedule:
    - cron: "0 0 1 * *"
  create:
    tags:
      - v*
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # macOS ARM64 (M1/M2)
  macos-arm64:
    runs-on: macos-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Cache Homebrew packages
      uses: actions/cache@v4
      with:
        path: |
          ~/Library/Caches/Homebrew
          /opt/homebrew/Cellar
        key: brew-arm64-${{ hashFiles('build-macos.sh') }}
        restore-keys: brew-arm64-

    - name: Cache TDLib build
      uses: actions/cache@v4
      with:
        path: |
          td/build
          td/example/java/build
        key: tdlib-macos-arm64-${{ github.sha }}
        restore-keys: tdlib-macos-arm64-

    - name: Build tdlib for macOS ARM64
      run: /bin/bash build-macos.sh

    - name: Package tdlib artifacts
      env:
        OS_NAME: ${{ runner.os }}
      run: |
        set -e
        ARCH=$(uname -m)
        echo "ARCH=$ARCH" >> $GITHUB_ENV
        if [ -d tdlib ]; then
          ARTIFACT_DIR=tdlib
        elif [ -d td/tdlib ]; then
          ARTIFACT_DIR=td/tdlib
        else
          echo "Artifact directory not found" && ls -la && exit 1
        fi
        # Add version to artifact name if triggered by tag
        if [[ "$GITHUB_REF" == refs/tags/* ]]; then
          VERSION="${GITHUB_REF#refs/tags/}"
          TAR_NAME="tdlib-${VERSION}-${OS_NAME}-${ARCH}.tar.gz"
        else
          TAR_NAME="tdlib-${OS_NAME}-${ARCH}.tar.gz"
        fi
        if [ "$ARTIFACT_DIR" = "td/tdlib" ]; then
          tar -czf "$TAR_NAME" -C td tdlib example/java
        else
          tar -czf "$TAR_NAME" -C . tdlib td/example/java/org
        fi
        echo "PACKAGE_FILE=$TAR_NAME" >> $GITHUB_ENV
        shasum -a 256 "$TAR_NAME"

    - name: Publish release asset
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ github.event.ref }}
        files: ${{ env.PACKAGE_FILE }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
